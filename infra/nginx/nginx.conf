# ============================================================================
#  Nginx — configuration principale
#  Plateforme de collecte des taxes locales GTFC
#
#  Les fichiers de sites sont générés au démarrage du conteneur à partir de
#  /etc/nginx/templates/*.conf.template (substitution de ${APP_DOMAIN},
#  ${API_PORT} et ${DASHBOARD_PORT} uniquement) vers /etc/nginx/sites/.
# ============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Journalisation ----------------------------------------------------
    # $upstream_response_time permet de repérer une API lente depuis les logs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main;

    # ---- Performances ------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 4096;
    server_tokens      off;          # ne pas divulguer la version de Nginx

    # ---- Tailles / délais --------------------------------------------------
    # 25 Mo : une photo de devanture + une photo de trottoir prises par un
    # téléphone Android récent tiennent largement dedans.
    client_max_body_size    25m;
    client_body_buffer_size 256k;
    client_body_timeout     120s;
    client_header_timeout   30s;
    send_timeout            120s;
    large_client_header_buffers 4 16k;

    # ---- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/vnd.api+json image/svg+xml;

    # ---- Sessions TLS ------------------------------------------------------
    # Déclarées ici, une seule fois : la zone de mémoire partagée est commune
    # à tous les blocs serveur (les répéter par serveur provoquerait un conflit).
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Limitation de débit ----------------------------------------------
    # Protège l'authentification contre le bourrage d'identifiants et l'API
    # contre un agent dont l'app boucle en mode synchronisation.
    limit_req_zone $binary_remote_addr zone=login_zone:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:20m    rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:20m;
    limit_conn_status 429;

    # ---- Adresse IP réelle -------------------------------------------------
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;

    # ---- WebSocket : suivi des agents en temps réel (dashboard, phase 6) ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Valeurs par défaut du proxy ---------------------------------------
    #
    #  Elles étaient dans snippets/proxy.conf, inclus DANS chaque location. Or
    #  nginx refuse une directive répétée dans le MÊME contexte : les trois
    #  emplacements qui demandaient 300 s après avoir inclus le fragment
    #  faisaient échouer le démarrage entier —
    #
    #      "proxy_read_timeout" directive is duplicate
    #
    #  Ici, dans « http », ce sont des défauts que chaque location peut
    #  REDÉFINIR sans conflit : c'est le mécanisme d'héritage de nginx, et
    #  c'est ce que le fragment essayait d'imiter sans le pouvoir.
    #
    #  Les proxy_set_header, eux, RESTENT dans le fragment : dès qu'une
    #  location en déclare un seul, elle perd tous ceux hérités. Les répéter
    #  par inclusion est alors la seule façon correcte.
    #
    #  Constaté le 11/09/2026, au premier démarrage réel de Nginx.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    proxy_buffering     on;
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    proxy_busy_buffers_size 32k;

    # Si le backend est momentanément indisponible (redémarrage PM2), on
    # retente une fois plutôt que de renvoyer une 502 à l'agent sur le terrain.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 15s;

    # ---- Sites -------------------------------------------------------------
    # NB : on n'inclut PAS /etc/nginx/conf.d/*.conf pour éviter le
    # default.conf livré avec l'image officielle.
    include /etc/nginx/sites/*.conf;
}
