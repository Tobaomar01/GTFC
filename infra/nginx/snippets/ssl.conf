# ----------------------------------------------------------------------------
#  Paramètres TLS communs à tous les hôtes HTTPS
#  Profil « intermediate » Mozilla : compatible avec les navigateurs et les
#  téléphones Android à partir d'Android 5, sans protocole obsolète.
# ----------------------------------------------------------------------------

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# NB : ssl_session_cache / ssl_session_timeout / ssl_session_tickets sont
# déclarés une seule fois dans nginx.conf (bloc http). Les répéter ici
# redéclarerait la même zone de mémoire partagée dans chaque bloc serveur.

# Agrafage OCSP : le navigateur n'a pas besoin d'interroger Let's Encrypt,
# ce qui compte quand la connexion sortante du serveur est lente.
ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout          5s;
