# ----------------------------------------------------------------------------
#  En-têtes et délais communs à toutes les directives proxy_pass
# ----------------------------------------------------------------------------

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Ne pas laisser fuiter les en-têtes internes du backend
proxy_hide_header X-Powered-By;

# Les délais, le tamponnage et la reprise sur erreur ont été REMONTÉS dans le
# bloc « http » de nginx.conf : déclarés ici, ils entraient en conflit avec les
# emplacements qui ont besoin d'un délai plus long — nginx refuse une directive
# répétée dans le même contexte, il ne la remplace pas.
#
# Ce qui reste ci-dessus doit, au contraire, être répété : dès qu'une location
# déclare un seul proxy_set_header, elle perd TOUS ceux qu'elle aurait hérités.
