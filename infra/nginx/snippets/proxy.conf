# ----------------------------------------------------------------------------
#  En-têtes et délais communs à toutes les directives proxy_pass
# ----------------------------------------------------------------------------

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Ne pas laisser fuiter les en-têtes internes du backend
proxy_hide_header X-Powered-By;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_buffering     on;
proxy_buffer_size   16k;
proxy_buffers       8 16k;
proxy_busy_buffers_size 32k;

# Si le backend est momentanément indisponible (redémarrage PM2), on retente
# une fois plutôt que de renvoyer une 502 à l'agent sur le terrain.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 15s;
