# ----------------------------------------------------------------------------
#  En-têtes de sécurité HTTP
#  `always` : les en-têtes sont émis même sur les réponses 4xx/5xx.
# ----------------------------------------------------------------------------

# HSTS — 1 an. À n'activer qu'une fois le HTTPS confirmé fonctionnel sur tous
# les sous-domaines, car un navigateur qui l'a reçu refusera le HTTP ensuite.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

# La plateforme n'utilise ni micro, ni paiement navigateur. La géolocalisation
# vient de l'app Android, pas du dashboard.
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Empêche le navigateur de mettre en cache une fiche commerce contenant des
# données fiscales sur un poste partagé de la mairie.
add_header Cache-Control             "no-store, no-cache, must-revalidate" always;
