# ============================================================================
#  PostgreSQL 16 — configuration serveur GTFC
#  Monté en lecture seule dans /etc/postgresql/postgresql.conf
#
#  Les valeurs mémoire (shared_buffers, work_mem, ...) sont surchargées par les
#  options -c passées dans docker-compose.yml, elles-mêmes issues du .env.
#  Ne modifiez donc PAS ces valeurs ici : modifiez le .env.
# ============================================================================

# --- Emplacements (obligatoires car le config_file est hors du PGDATA) ------
data_directory = '/var/lib/postgresql/data'
hba_file       = '/var/lib/postgresql/data/pg_hba.conf'
ident_file     = '/var/lib/postgresql/data/pg_ident.conf'

# --- Connexions -------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 5

# --- Mémoire (surchargées par docker-compose, voir .env) --------------------
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
huge_pages = try

# --- Écriture / durabilité --------------------------------------------------
wal_level = replica
synchronous_commit = on
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Archivage WAL désactivé en phase pilote : la sauvegarde repose sur un
# pg_dump quotidien (scripts/backup-postgres.sh). A activer si l'on souhaite
# du PITR (Point In Time Recovery) plus tard.
archive_mode = off

# --- Planificateur (SSD / NVMe attendu sur le Mini PC) ----------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallélisme -----------------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Autovacuum (important : forte volumétrie sur paiements et audit) -------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Journalisation ---------------------------------------------------------
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 500ms      # trace les requêtes lentes (> 500 ms)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Africa/Dakar'

# --- Statistiques ------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# --- Localisation -----------------------------------------------------------
timezone = 'Africa/Dakar'
datestyle = 'iso, dmy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.french'

# --- Sécurité / robustesse --------------------------------------------------
password_encryption = scram-sha-256

# Les garde-fous statement_timeout / lock_timeout / idle_in_transaction sont
# volontairement définis AU NIVEAU DU RÔLE gtfc_app (voir init/02-app-role.sh)
# et non ici : appliqués globalement, ils feraient échouer les migrations et
# les créations d'index de la phase 2, qui dépassent légitimement 60 s.
